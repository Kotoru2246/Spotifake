<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>artist_test - Spotifake</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="dash-body">
  <div class="dash-wrapper">
    <!-- Sidebar -->
    <aside class="dash-sidebar">
      <div class="dash-sidebar-brand">
        <h2>SPOTIFAKE</h2>
        <small>Artist Manager</small>
      </div>
      <nav class="dash-sidebar-nav">
        
    <a href="/artist/manager" class="dash-sidebar-link active">
      <i class="bi bi-grid-1x2-fill"></i> Dashboard
    </a>
    <a href="/artist/manager/studio" class="dash-sidebar-link ">
      <i class="bi bi-sliders"></i> Artist Studio
    </a>
    <a href="/artist/manager/profile" class="dash-sidebar-link ">
      <i class="bi bi-person-fill"></i> Edit Profile
    </a>
    <a href="/artist/manager/albums" class="dash-sidebar-link ">
      <i class="bi bi-disc-fill"></i> Albums
    </a>
    <a href="/artist/manager/songs" class="dash-sidebar-link ">
      <i class="bi bi-music-note-beamed"></i> Songs
    </a>
  
      </nav>
      <div class="dash-sidebar-footer">
        <a href="/" class="dash-sidebar-back">
          <i class="bi bi-arrow-left"></i> Back to Player
        </a>
      </div>
    </aside>

    <!-- Main -->
    <main class="dash-main">
      <!-- Top Bar -->
      <div class="dash-topbar">
        <div class="dash-topbar-left">
          
          <div class="dash-topbar-title">
            <span class="dash-topbar-eyebrow">Artist Manager</span>
            <h1 class="dash-topbar-heading">artist_test</h1>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="dash-content">
        
  <!-- Stat Cards -->
  <div class="dash-stats-grid">
    <div class="dash-stat-card">
      <div class="stat-icon green"><i class="bi bi-headphones"></i></div>
      <div class="stat-label">Total Streams</div>
      <div class="stat-value dash-number">0</div>
    </div>
    <div class="dash-stat-card">
      <div class="stat-icon cyan"><i class="bi bi-music-note-beamed"></i></div>
      <div class="stat-label">Total Songs</div>
      <div class="stat-value dash-number">0</div>
    </div>
    <div class="dash-stat-card">
      <div class="stat-icon purple"><i class="bi bi-disc-fill"></i></div>
      <div class="stat-label">Total Albums</div>
      <div class="stat-value dash-number">0</div>
    </div>
  </div>

  <!-- Recent Songs -->
  <div class="dash-card">
    <div class="dash-card-header">
      <h3><i class="bi bi-clock-history"></i> Recent Uploads</h3>
      <a href="/artist/manager/songs" class="dash-btn dash-btn-secondary dash-btn-sm">View All</a>
    </div>
    <div class="dash-card-body no-pad">
      <table class="dash-table">
        <thead>
          <tr>
            <th>Title</th>
            <th>Genre</th>
            <th>Mood</th>
            <th>Streams</th>
            <th>Uploaded</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="5" class="text-center" style="padding: 2.5rem; color: #888;">No songs uploaded yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>
  
      </div>
    </main>
  </div>

  
</body>
</html>

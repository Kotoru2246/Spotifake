<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile - Spotifake</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="dash-body">
  <div class="dash-wrapper">
    <!-- Sidebar -->
    <aside class="dash-sidebar">
      <div class="dash-sidebar-brand">
        <h2>SPOTIFAKE</h2>
        <small>Artist Manager</small>
      </div>
      <nav class="dash-sidebar-nav">
        
    <a href="/artist/manager" class="dash-sidebar-link ">
      <i class="bi bi-grid-1x2-fill"></i> Dashboard
    </a>
    <a href="/artist/manager/studio" class="dash-sidebar-link ">
      <i class="bi bi-sliders"></i> Artist Studio
    </a>
    <a href="/artist/manager/profile" class="dash-sidebar-link active">
      <i class="bi bi-person-fill"></i> Edit Profile
    </a>
    <a href="/artist/manager/albums" class="dash-sidebar-link ">
      <i class="bi bi-disc-fill"></i> Albums
    </a>
    <a href="/artist/manager/songs" class="dash-sidebar-link ">
      <i class="bi bi-music-note-beamed"></i> Songs
    </a>
  
      </nav>
      <div class="dash-sidebar-footer">
        <a href="/" class="dash-sidebar-back">
          <i class="bi bi-arrow-left"></i> Back to Player
        </a>
      </div>
    </aside>

    <!-- Main -->
    <main class="dash-main">
      <!-- Top Bar -->
      <div class="dash-topbar">
        <div class="dash-topbar-left">
          
            <a href="/artist/manager" class="dash-back-btn">
              <i class="bi bi-chevron-left"></i> Dashboard
            </a>
          
          <div class="dash-topbar-title">
            <span class="dash-topbar-eyebrow">Artist Manager</span>
            <h1 class="dash-topbar-heading">Edit Profile</h1>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="dash-content">
        
  
  <div class="dash-card">
    <div class="dash-card-header">
      <h3><i class="bi bi-person-fill"></i> Profile Information</h3>
    </div>
    <div class="dash-card-body">
      <form method="post" action="/artist/manager/profile">
        <div class="dash-form-grid">
          <div class="dash-form-group">
            <label class="dash-label">Stage Name</label>
            <input type="text" name="stageName" class="dash-input" value="artist_test" required>
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Website</label>
            <input type="url" name="website" class="dash-input" value="" placeholder="https://...">
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Date of Birth</label>
            <input type="date" name="dateOfBirth" class="dash-input" value="">
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Nationality</label>
            <input type="text" name="nationality" class="dash-input" value="" placeholder="e.g. American, Thai, Korean">
          </div>
          <div class="dash-form-group full-width">
            <label class="dash-label">Profile Image URL</label>
            <input type="url" name="profileImageUrl" class="dash-input" value="" placeholder="https://...">
          </div>
          <div class="dash-form-group full-width">
            <label class="dash-label">Banner Image URL</label>
            <input type="url" name="bannerImageUrl" class="dash-input" value="" placeholder="https://...">
          </div>
          <div class="dash-form-group full-width">
            <label class="dash-label">Bio</label>
            <textarea name="bio" class="dash-textarea" rows="4"></textarea>
          </div>
        </div>
        <div style="display: flex; justify-content: flex-end; margin-top: 1rem;">
          <button type="submit" class="dash-btn dash-btn-primary">
            <i class="bi bi-check-lg"></i> Save Changes
          </button>
        </div>
      </form>
    </div>
  </div>
  
      </div>
    </main>
  </div>

  
</body>
</html>

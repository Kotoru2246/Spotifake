<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Songs - Spotifake</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/dashboard.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body class="dash-body">
  <div class="dash-wrapper">
    <!-- Sidebar -->
    <aside class="dash-sidebar">
      <div class="dash-sidebar-brand">
        <h2>SPOTIFAKE</h2>
        <small>Artist Manager</small>
      </div>
      <nav class="dash-sidebar-nav">
        
    <a href="/artist/manager" class="dash-sidebar-link ">
      <i class="bi bi-grid-1x2-fill"></i> Dashboard
    </a>
    <a href="/artist/manager/studio" class="dash-sidebar-link ">
      <i class="bi bi-sliders"></i> Artist Studio
    </a>
    <a href="/artist/manager/profile" class="dash-sidebar-link ">
      <i class="bi bi-person-fill"></i> Edit Profile
    </a>
    <a href="/artist/manager/albums" class="dash-sidebar-link ">
      <i class="bi bi-disc-fill"></i> Albums
    </a>
    <a href="/artist/manager/songs" class="dash-sidebar-link active">
      <i class="bi bi-music-note-beamed"></i> Songs
    </a>
  
      </nav>
      <div class="dash-sidebar-footer">
        <a href="/" class="dash-sidebar-back">
          <i class="bi bi-arrow-left"></i> Back to Player
        </a>
      </div>
    </aside>

    <!-- Main -->
    <main class="dash-main">
      <!-- Top Bar -->
      <div class="dash-topbar">
        <div class="dash-topbar-left">
          
            <a href="/artist/manager" class="dash-back-btn">
              <i class="bi bi-chevron-left"></i> Dashboard
            </a>
          
          <div class="dash-topbar-title">
            <span class="dash-topbar-eyebrow">Artist Manager</span>
            <h1 class="dash-topbar-heading">Songs</h1>
          </div>
        </div>
      </div>

      <!-- Content -->
      <div class="dash-content">
        
  
  <!-- Action Bar -->
  <div class="dash-action-bar">
    <div class="dash-search-wrapper" style="flex: 1; max-width: 400px; margin-bottom: 0;">
      <i class="bi bi-search"></i>
      <input type="text" class="dash-search-input" id="songSearch" placeholder="Search songs..." oninput="filterSongTable()">
    </div>
    <button class="dash-btn dash-btn-primary" onclick="document.getElementById('uploadSongModal').classList.add('show')">
      <i class="bi bi-cloud-arrow-up-fill"></i> Upload New Song
    </button>
  </div>

  <!-- Songs Table -->
  <div class="dash-card">
    <div class="dash-card-body no-pad">
      <table class="dash-table" id="songTable">
        <thead>
          <tr>
            <th>Title</th>
            <th>Album</th>
            <th>Genre</th>
            <th>Mood</th>
            <th>Language</th>
            <th>Streams</th>
            <th>Uploaded</th>
            <th>Status</th>
            <th>Actions</th>
          </tr>
        </thead>
        <tbody>
          <tr><td colspan="9" class="text-center" style="padding: 3rem; color: #888;">No songs uploaded yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- Upload Song Modal -->
  <div class="dash-modal-overlay" id="uploadSongModal">
    <div class="dash-modal">
      <div class="dash-modal-header">
        <h3><i class="bi bi-cloud-upload-fill"></i> Upload New Song</h3>
        <button class="dash-modal-close" onclick="document.getElementById('uploadSongModal').classList.remove('show')">&times;</button>
      </div>
      <form method="post" action="/artist/manager/songs/upload" enctype="multipart/form-data">
        <div class="dash-modal-body">
          <div class="dash-form-group">
            <label class="dash-label">Audio File (MP3, WAV, FLAC, M4A)</label>
            <input type="file" name="audioFile" class="dash-input" accept="audio/*" required>
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Album (Optional)</label>
            <select name="albumId" class="dash-select">
              <option value="">None (Single)</option>
              
            </select>
          </div>
        </div>
        <div class="dash-modal-footer">
          <button type="button" class="dash-btn dash-btn-secondary" onclick="document.getElementById('uploadSongModal').classList.remove('show')">Cancel</button>
          <button type="submit" class="dash-btn dash-btn-primary"><i class="bi bi-cloud-arrow-up-fill"></i> Upload & Analyze Song</button>
        </div>
      </form>
    </div>
  </div>

  <!-- Edit Song Modal -->
  <div class="dash-modal-overlay" id="editSongModal">
    <div class="dash-modal">
      <div class="dash-modal-header">
        <h3><i class="bi bi-pencil-fill"></i> Edit Song</h3>
        <button class="dash-modal-close" onclick="document.getElementById('editSongModal').classList.remove('show')">&times;</button>
      </div>
      <form method="post" id="editSongForm">
        <div class="dash-modal-body">
          <div class="dash-form-group">
            <label class="dash-label">Title</label>
            <input type="text" name="title" id="editTitle" class="dash-input" required>
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Album</label>
            <select name="albumId" id="editAlbumId" class="dash-select">
              <option value="">None (Single)</option>
              
            </select>
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Genre</label>
            <input type="text" name="customGenre" id="editGenre" class="dash-input">
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Mood</label>
            <input type="text" name="mood" id="editMood" class="dash-input">
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Language</label>
            <input type="text" name="language" id="editLanguage" class="dash-input">
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Credits</label>
            <input type="text" name="credits" id="editCredits" class="dash-input">
          </div>
          <div class="dash-form-group">
            <label class="dash-label">Lyrics</label>
            <textarea name="lyrics" id="editLyrics" class="dash-textarea" rows="4"></textarea>
          </div>
        </div>
        <div class="dash-modal-footer">
          <button type="button" class="dash-btn dash-btn-secondary" onclick="document.getElementById('editSongModal').classList.remove('show')">Cancel</button>
          <button type="submit" class="dash-btn dash-btn-primary"><i class="bi bi-check-lg"></i> Save Changes</button>
        </div>
      </form>
    </div>
  </div>
  
      </div>
    </main>
  </div>

  
  <script>
  function filterSongTable() {
    const q = document.getElementById('songSearch').value.toLowerCase();
    document.querySelectorAll('#songTable tbody tr').forEach(row => {
      row.style.display = (row.dataset.name || '').includes(q) ? '' : 'none';
    });
  }
  function openEditSong(id, title, mood, language, lyrics, credits, customGenre, albumId) {
    document.getElementById('editSongForm').action = '/artist/manager/songs/' + id + '/update';
    document.getElementById('editTitle').value = title;
    document.getElementById('editMood').value = mood;
    document.getElementById('editLanguage').value = language;
    document.getElementById('editLyrics').value = lyrics;
    document.getElementById('editCredits').value = credits;
    document.getElementById('editGenre').value = customGenre;
    document.getElementById('editAlbumId').value = albumId || '';
    document.getElementById('editSongModal').classList.add('show');
  }
  </script>
  
</body>
</html>

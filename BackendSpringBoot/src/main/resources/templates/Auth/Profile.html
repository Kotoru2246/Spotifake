<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>User Profile - Spotifake</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    body { background-color: #121212; color: #fff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; margin: 0; padding: 2rem; }
    .profile-card { background: #181818; border: 1px solid #282828; border-radius: 12px; max-width: 600px; margin: 2rem auto; padding: 2.5rem; }
    .profile-header { display: flex; align-items: center; gap: 1.5rem; margin-bottom: 2rem; }
    .avatar { width: 80px; height: 80px; border-radius: 50%; background: #282828; display: flex; align-items: center; justify-content: center; font-size: 2.5rem; color: #1db954; }
    .info h1 { margin: 0; font-size: 1.8rem; }
    .info p { margin: 0.25rem 0 0 0; color: #b3b3b3; }
    .badge { display: inline-block; padding: 3px 10px; background: #1db954; color: #000; border-radius: 500px; font-weight: 700; font-size: 0.75rem; text-transform: uppercase; margin-top: 0.5rem; }
    .back-btn { color: #1db954; text-decoration: none; font-weight: 600; display: inline-flex; align-items: center; gap: 6px; margin-bottom: 1.5rem; }
  </style>
</head>
<body>
  <div class="profile-card">
    <a href="/" class="back-btn"><i class="bi bi-arrow-left"></i> Back to Player</a>
    <div class="profile-header">
      <div class="avatar"><i class="bi bi-person-fill"></i></div>
      <div class="info">
        <h1 th:text="${user.displayName}">User</h1>
        <p th:text="${user.email}">user@domain.com</p>
        <span class="badge" th:text="${user.role}">USER</span>
      </div>
    </div>
    <div style="border-top: 1px solid #282828; padding-top: 1.5rem;">
      <p><strong>Account Status:</strong> <span th:text="${user.accountStatus}">Active</span></p>
      <p><strong>Subscription Tier:</strong> <span th:text="${user.subscriptionTier}">Free</span></p>
      <p><strong>Bio:</strong> <span th:text="${user.bio ?: 'No bio provided'}">No bio</span></p>
      <div style="margin-top: 2rem; display: flex; gap: 1rem;">
        <a href="/Auth/Logout" class="dash-btn dash-btn-danger" style="background: #e22134; color: #fff; padding: 0.6rem 1.2rem; border-radius: 500px; text-decoration: none; font-weight: 600;">Log Out</a>
      </div>
    </div>
  </div>
</body>
</html>

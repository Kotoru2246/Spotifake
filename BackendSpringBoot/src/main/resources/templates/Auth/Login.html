<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Log In - Spotifake</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="/css/site.css" />
  <style>
    body { background-color: #121212; color: #fff; font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; padding: 1rem; }
    .auth-card { background: #181818; border: 1px solid #282828; border-radius: 12px; width: 100%; max-width: 440px; padding: 2.5rem; box-shadow: 0 12px 32px rgba(0,0,0,0.6); }
    .brand-logo { font-size: 1.8rem; font-weight: 800; color: #1db954; text-align: center; margin-bottom: 1.5rem; letter-spacing: -0.5px; }
    .form-group { margin-bottom: 1.25rem; }
    .form-group label { display: block; font-size: 0.85rem; font-weight: 600; margin-bottom: 0.5rem; color: #b3b3b3; }
    .form-control { width: 100%; padding: 0.85rem 1rem; background: #282828; border: 1px solid #3e3e3e; border-radius: 6px; color: #fff; font-size: 0.95rem; box-sizing: border-box; }
    .form-control:focus { outline: none; border-color: #1db954; box-shadow: 0 0 0 2px rgba(29,185,84,0.3); }
    .btn-submit { width: 100%; padding: 0.9rem; background: #1db954; color: #000; border: none; border-radius: 500px; font-weight: 700; font-size: 1rem; cursor: pointer; transition: transform 0.1s, background-color 0.2s; margin-top: 1rem; }
    .btn-submit:hover { background: #1ed760; transform: scale(1.02); }
    .quick-creds { margin-top: 1.5rem; padding: 1rem; background: #222; border-radius: 8px; font-size: 0.8rem; }
    .quick-creds h4 { margin: 0 0 0.5rem 0; color: #1db954; font-size: 0.85rem; }
    .badge-btn { display: inline-block; background: #333; padding: 4px 8px; border-radius: 4px; margin: 3px; cursor: pointer; color: #fff; text-decoration: none; border: none; font-size: 0.75rem; }
    .badge-btn:hover { background: #444; }
    .auth-footer { text-align: center; margin-top: 1.5rem; font-size: 0.85rem; color: #b3b3b3; }
    .auth-footer a { color: #1db954; text-decoration: none; font-weight: 600; }
    .error-alert { background: rgba(226, 33, 52, 0.2); border: 1px solid #e22134; color: #ff6b6b; padding: 0.75rem 1rem; border-radius: 6px; margin-bottom: 1.25rem; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="auth-card">
    <div class="brand-logo"><i class="bi bi-spotify"></i> SPOTIFAKE</div>
    <h2 style="font-size: 1.4rem; font-weight: 700; text-align: center; margin-bottom: 1.5rem;">Sign In</h2>
    
    <div th:if="${errorMessage}" class="error-alert" th:text="${errorMessage}"></div>

    <form method="POST" action="/Auth/Login">
      <input type="hidden" name="returnUrl" th:value="${returnUrl}" value="/" />
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" name="username" class="form-control" placeholder="user_test" required />
      </div>
      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required />
      </div>
      <button type="submit" class="btn-submit">Log In</button>
    </form>

    <div class="quick-creds">
      <h4>Demo Credentials (Click to fill)</h4>
      <div>
        <button type="button" class="badge-btn" onclick="fillCreds('user_test', 'User@123')">User (user_test)</button>
        <button type="button" class="badge-btn" onclick="fillCreds('artist_test', 'Artist@123')">Artist (artist_test)</button>
        <button type="button" class="badge-btn" onclick="fillCreds('admin_test', 'Admin@123')">Admin (admin_test)</button>
      </div>
    </div>

    <div class="auth-footer">
      Don't have an account? <a href="/Auth/Register">Sign up for Spotifake</a>
    </div>
  </div>

  <script>
    function fillCreds(u, p) {
      document.getElementById('username').value = u;
      document.getElementById('password').value = p;
    }
  </script>
</body>
</html>

server.port=8000
server.admin.port=9000
server.servlet.context-path=/

# Actuator + Prometheus metrics on a separate port, reachable from this machine only.
# docker-compose sets MANAGEMENT_ADDRESS=0.0.0.0 so Prometheus can scrape it; the port is not published.
management.server.port=${MANAGEMENT_PORT:8081}
management.server.address=${MANAGEMENT_ADDRESS:127.0.0.1}
management.endpoints.web.exposure.include=health,prometheus

# HTTP Compression (Fast LAN & Mobile Loading)
server.compression.enabled=true
server.compression.mime-types=text/html,text/xml,text/plain,text/css,text/javascript,application/javascript,application/json,application/xml
server.compression.min-response-size=1024

# Multipart uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Thymeleaf
spring.thymeleaf.prefix=${SPRING_THYMELEAF_PREFIX:classpath:/templates/}
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Static Resources
# Source folder first so JS/CSS edits show on a browser refresh without rebuilding the jar;
# the jar's classpath copy is the fallback when the app runs outside BackendSpringBoot/.
spring.web.resources.static-locations=${SPRING_STATIC_LOCATIONS:file:src/main/resources/static/,classpath:/static/,file:../uploads/,file:uploads/}

# Application Specific
app.jwt.secret=spotifake-dev-secret-change-me-12345
app.jwt.expiration-ms=86400000
app.db.path=${APP_DB_PATH:../backendai.db}
app.uploads.dir=uploads

# spotdl downloader (DownloaderService). Empty python = <project-root>/.venv python if present, else "python".
app.downloader.project-root=${DOWNLOADER_PROJECT_ROOT:..}
app.downloader.python=${DOWNLOADER_PYTHON:}
app.downloader.timeout-minutes=30

# DataSource SQLite & HikariCP Pool
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:../backendai.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# Stripe Payment Gateway & Sandbox Test Mode (Free Developer Test Mode)
# Configure via environment variables or paste your test keys
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}



# Audio analysis (BackendAI /internal/analyze)
spotifake.analysis.url=${AI_SERVICE_URL:http://localhost:5000}
spotifake.analysis.token=${INTERNAL_API_TOKEN:}
spotifake.analysis.enabled=${ANALYSIS_ENABLED:true}
spotifake.analysis.connect-timeout-ms=2000
spotifake.analysis.read-timeout-ms=120000

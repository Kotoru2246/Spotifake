server.port=8000
server.admin.port=9000
server.servlet.context-path=/

# Multipart uploads
spring.servlet.multipart.max-file-size=100MB
spring.servlet.multipart.max-request-size=100MB

# Thymeleaf
spring.thymeleaf.prefix=${SPRING_THYMELEAF_PREFIX:file:src/main/resources/templates/}
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML
spring.thymeleaf.cache=false
spring.thymeleaf.encoding=UTF-8

# Static Resources
spring.web.resources.static-locations=file:src/main/resources/static/,classpath:/static/,file:../uploads/,file:uploads/

# Application Specific
app.jwt.secret=spotifake-dev-secret-change-me-12345
app.jwt.expiration-ms=86400000
app.db.path=${APP_DB_PATH:../backendai.db}
app.uploads.dir=uploads

# DataSource SQLite & HikariCP Pool
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:sqlite:../backendai.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=2
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=10000
spring.datasource.hikari.connection-test-query=SELECT 1

# Stripe Payment Gateway & Sandbox Test Mode (Free Developer Test Mode)
# Configure via environment variables or paste your test keys
stripe.api.key=${STRIPE_API_KEY:sk_test_placeholder}
stripe.public.key=${STRIPE_PUBLIC_KEY:pk_test_placeholder}
stripe.webhook.secret=${STRIPE_WEBHOOK_SECRET:}



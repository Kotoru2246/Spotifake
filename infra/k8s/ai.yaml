# Python AI service (FastAPI). The Service name "backendai" is what Spring calls.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backendai
spec:
  replicas: 1
  selector:
    matchLabels: { app: backendai }
  template:
    metadata:
      labels: { app: backendai }
    spec:
      containers:
        - name: backendai
          image: spotifake-ai:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5000
          env:
            - name: INTERNAL_API_TOKEN
              valueFrom:
                secretKeyRef: { name: spotifake-secrets, key: internal-api-token }
          resources:
            requests: { cpu: 250m, memory: 1Gi }
            limits: { memory: 4Gi }     # PyTorch needs a lot of memory
          startupProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet: { path: /health, port: 5000 }
          livenessProbe:
            httpGet: { path: /health, port: 5000 }
            periodSeconds: 30
            timeoutSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: backendai
spec:
  selector: { app: backendai }
  ports:
    - { port: 5000, targetPort: 5000 }

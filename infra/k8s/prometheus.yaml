# Same image as Docker Compose, with infra/prometheus/*.yml already inside.
# Its target "backend:8081" is the backend Service.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: spotifake-prometheus:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9090
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
          volumeMounts:
            - { name: data, mountPath: /prometheus }
      volumes:
        - name: data
          emptyDir: {}      # metrics history is lost when the pod is deleted
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
spec:
  type: NodePort
  selector: { app: prometheus }
  ports:
    - { port: 9090, targetPort: 9090, nodePort: 30909 }

groups:
  - name: spotifake
    rules:
      - alert: BackendDown
        expr: up{job="spotifake-backend"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: Spring Boot backend cannot be scraped

      - alert: BackendServerErrors
        expr: sum(rate(http_server_requests_seconds_count{job="spotifake-backend", status=~"5.."}[5m])) > 0.1
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: Backend is returning HTTP 5xx errors

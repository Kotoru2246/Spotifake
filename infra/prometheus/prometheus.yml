global:
  scrape_interval: 15s      # how often metrics are collected
  evaluation_interval: 15s  # how often alert rules are checked

rule_files:
  - alerts.yml

scrape_configs:
  # Prometheus watching itself
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']

  # Spring Boot metrics (management port, only reachable inside the Docker network)
  - job_name: spotifake-backend
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ['backend:8081']

  # HTTP checks through Blackbox Exporter: web page, AI service and Essentia health
  - job_name: spotifake-http
    metrics_path: /probe
    params:
      module: [http_2xx]
    static_configs:
      - targets:
          - http://backend:8000/
          - http://backendai:5000/health
          - http://essentia:3000/health
    relabel_configs:
      - source_labels: [__address__]
        target_label: __param_target
      - source_labels: [__param_target]
        target_label: instance
      - target_label: __address__
        replacement: blackbox:9115

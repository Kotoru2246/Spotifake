<svg xmlns="http://www.w3.org/2000/svg" width="1700" height="560" viewBox="0 0 1700 560"><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#374151"/></marker></defs><rect width="100%" height="100%" fill="#ffffff"/><rect x="20" y="20" width="1660" height="70" rx="10" fill="#fff8e1" stroke="#c77a12" stroke-width="2"/>
<text x="850" y="64.0" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#8a5300" text-anchor="middle">Thiết kế đề xuất, chưa triển khai: nhóm chưa có server public, phần deploy qua SSH để lại cho bước sau</text>
<rect x="30" y="130" width="300" height="200" rx="10" fill="#f2edfb" stroke="#7346c8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="180.0" y="203.1" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Jenkins</text>
<text x="180.0" y="230.4" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">pipeline thứ hai</text>
<text x="180.0" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">giống pipeline local:</text>
<text x="180.0" y="274.6" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">build, test, Quality Gate</text>
<rect x="365" y="130" width="300" height="200" rx="10" fill="#e8f1fd" stroke="#2f6fd1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="515.0" y="214.2" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Docker image</text>
<text x="515.0" y="241.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">spotifake-web:N</text>
<text x="515.0" y="263.6" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">spotifake-backend:N</text>
<rect x="700" y="130" width="300" height="200" rx="10" fill="#eef0f3" stroke="#6b7280" stroke-width="2" stroke-dasharray="8 6"/>
<text x="850.0" y="214.2" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Docker registry</text>
<text x="850.0" y="241.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">lưu image để server</text>
<text x="850.0" y="263.6" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">kéo về (docker push)</text>
<rect x="1035" y="130" width="300" height="200" rx="10" fill="#f2edfb" stroke="#7346c8" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1185.0" y="192.1" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Stage deploy (SSH)</text>
<text x="1185.0" y="219.4" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">sshagent + credential</text>
<text x="1185.0" y="241.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">ssh user@server</text>
<text x="1185.0" y="263.6" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">docker compose pull</text>
<text x="1185.0" y="285.7" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">docker compose up -d</text>
<rect x="1370" y="130" width="300" height="200" rx="10" fill="#e8f1fd" stroke="#2f6fd1" stroke-width="2" stroke-dasharray="8 6"/>
<text x="1520.0" y="203.1" font-family="Segoe UI, Arial, sans-serif" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">Server public</text>
<text x="1520.0" y="230.4" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">Web MVC, FastAPI,</text>
<text x="1520.0" y="252.5" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">SQL Server</text>
<text x="1520.0" y="274.6" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">truy cập qua IP public</text>
<line x1="330" y1="230.0" x2="365" y2="230.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="7 5"/>
<line x1="665" y1="230.0" x2="700" y2="230.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="7 5"/>
<line x1="1000" y1="230.0" x2="1035" y2="230.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="7 5"/>
<line x1="1335" y1="230.0" x2="1370" y2="230.0" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="7 5"/>
<polyline points="850.0,330 850.0,420 1520.0,420 1520.0,330" fill="none" stroke="#374151" stroke-width="2.2" marker-end="url(#ah)" stroke-dasharray="7 5"/>
<text x="1185.0" y="450.0" font-family="Segoe UI, Arial, sans-serif" font-size="16" font-weight="normal" fill="#4b5563" text-anchor="middle">server kéo image từ registry</text>
<text x="850" y="520.0" font-family="Segoe UI, Arial, sans-serif" font-size="17" font-weight="normal" fill="#4b5563" text-anchor="middle">Prometheus và Grafana chỉ yêu cầu trên pipeline local, nên không đưa lên server public.</text></svg>